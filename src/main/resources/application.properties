spring.application.name=auth-service
server.servlet.context-path=/auth
server.port=8084

# WEB BASE URL
web.base.url=${WEB_BASE_URL:http://localhost:3001}
app.base.url=${APP_BASE_URL:http://localhost:8099}

# GOOGLE STUDENT
# Configuração do OAuth2 para o Google
spring.security.oauth2.client.registration.google-student.provider=google
spring.security.oauth2.client.registration.google-student.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google-student.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google-student.scope=email,profile
spring.security.oauth2.client.registration.google-student.redirect-uri=http://172.178.116.210:8084/auth/login/oauth2/code/{registrationId}

# GOOGLE PREFECTURE
# Configuração do OAuth2 para o Google
spring.security.oauth2.client.registration.google-prefecture.provider=google
spring.security.oauth2.client.registration.google-prefecture.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google-prefecture.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google-prefecture.scope=email,profile
spring.security.oauth2.client.registration.google-prefecture.redirect-uri=http://172.178.116.210:8084/auth/login/oauth2/code/{registrationId}


# DATABASE
spring.datasource.url=${AUTH_DATASOURCE_URL:jdbc:postgresql://localhost:5434/auth_database}
spring.datasource.username=${DATASOURCE_USERNAME:rota-facil}
spring.datasource.password=${DATASOURCE_PASSWORD:admin}


# JPA + HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.log-resolvers=true

#  EUREKA
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8081/eureka}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.fetch-registry=true


# RABBIMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:rota-facil}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}


# AUTH EXCHANGE
rabbitmq.auth.exchange=${RABBITMQ_AUTH_EXCHANGE:auth.events}

rabbitmq.user.created.routing.key=${RABBITMQ_USER_CREATED_ROUTING_KEY:user.created}
rabbitmq.user.updated.routing.key=${RABBITMQ_USER_UPDATED_ROUTING_KEY:user.updated}
rabbitmq.user.deleted.routing.key=${RABBITMQ_USER_DELETED_ROUTING_KEY:user.deleted}
rabbitmq.user.email.changed.routing.key=${RABBITMQ_USER_EMAIL_CHANGED_ROUTING_KEY:user.email.changed}
rabbitmq.user.deactivate.routing.key=${RABBITMQ_USER_DEACTIVATE_ROUTING_KEY:user.deactivate}

rabbitmq.prefecture.created.routing.key=${RABBITMQ_PREFECTURE_CREATED_ROUTING_KEY:prefecture.created}
rabbitmq.prefecture.updated.routing.key=${RABBITMQ_PREFECTURE_UPDATED_ROUTING_KEY:prefecture.updated}
rabbitmq.prefecture.deleted.routing.key=${RABBITMQ_PREFECTURE_DELETED_ROUTING_KEY:prefecture.deleted}
rabbitmq.user.logout.routing.key=${RABBITMQ_USER_LOGOUT_ROUTING_KEY:user.logout}
rabbitmq.driver.admin.updated.routing.key=${RABBITMQ_DRIVER_ADMIN_UPDATED_ROUTING_KEY:driver.admin.updated}

rabbitmq.auth.user.updated.queue=${RABBITMQ_AUTH_USER_UPDATED_QUEUE:auth.user.updated.queue}


# TRANSPORT EXCHANGE
rabbitmq.transport.exchange=${RABBITMQ_TRANSPORT_EXCHANGE:transport.events}
# routing keys
rabbitmq.user.feedback.routing.key=${RABBITMQ_USER_FEEDBACK_ROUTING_KEY:user.feedback}
rabbitmq.user.trip.completed.routing.key=${RABBITMQ_USER_TRIP_COMPLETED_ROUTING_KEY:trip.completed}
rabbitmq.user.trips.increased.routing.key=${RABBITMQ_USER_TRIPS_INCREASED_ROUTING_KEY:user.trips.increased}
rabbitmq.user.trips.decreased.routing.key=${RABBITMQ_USER_TRIPS_DECREASED_ROUTING_KEY:user.trips.decreased}

# queues
rabbitmq.auth.user.complete.trip.queue=${RABBITMQ_USER_COMPLETE_TRIP_QUEUE:auth.user.complete.trip.queue}
rabbitmq.auth.user.trips.increased.queue=${RABBITMQ_USER_TRIPS_INCREASED_QUEUE:auth.user.trips.increased.queue}
rabbitmq.auth.user.trips.decreased.queue=${RABBITMQ_USER_TRIPS_DECREASED_QUEUE:auth.user.trips.decreased.queue}

# security
security.private.key=${SECURITY_PRIVATE_KEY:}


# OBSERVABILITY
# tracing
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

# metrics
management.otlp.metrics.export.enabled=true

# collector
management.otlp.tracing.endpoint=${COLLECTOR_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.url=${COLLECTOR_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}

# SWAGGER
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
server.forward-headers-strategy=framework